services:
  instantreports:
    build: .
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ir:${DB_PASSWORD:-secret}@postgres:5432/instantreports
      - SECRET_KEY=${SECRET_KEY}
      - LDAP_URL=${LDAP_URL:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_SEARCH_BASE=${LDAP_SEARCH_BASE:-}
      - AI_BASE_URL=${AI_BASE_URL:-http://llama-cpp:8080/v1}
      - AI_API_KEY=${AI_API_KEY:-none}
      - AI_MODEL=${AI_MODEL:-local-model}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-reports@example.com}
      # Bootstrap admin (created on first start if the users table is empty).
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      # Local HTTP stack: cookies must not require TLS. Set to "true" (or drop
      # this line) when serving over HTTPS.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Comma-separated extra browser origins allowed to call the API.
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - report_data:/app/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: instantreports
      POSTGRES_USER: ir
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_northwind.sh:/docker-entrypoint-initdb.d/01-init-northwind.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ir -d instantreports && pg_isready -U ir -d northwind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  report_data:
