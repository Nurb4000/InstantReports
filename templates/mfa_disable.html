{% extends "base.html" %}

{% block title %}Disable MFA - InstantReports{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2>Disable two-step verification</h2>
                    <p class="text-muted">
                        Enter your password to confirm disabling MFA. After this, you'll sign in
                        with just your password.
                    </p>

                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="post" action="/auth/mfa-disable">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                required
                                autofocus
                                autocomplete="current-password"
                                placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-danger">Disable MFA</button>
                        <a href="/settings" class="btn btn-outline-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
