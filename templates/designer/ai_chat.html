<style>
    .ai-chat-container {
        display: flex;
        flex-direction: column;
        height: 500px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: white;
    }
    .ai-chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
    }
    .ai-chat-message {
        margin-bottom: 1rem;
        padding: 0.75rem;
        border-radius: 4px;
    }
    .ai-chat-message.user {
        background: #e3f2fd;
        text-align: right;
    }
    .ai-chat-message.assistant {
        background: #f5f5f5;
    }
    .ai-chat-input {
        display: flex;
        gap: 0.5rem;
        padding: 1rem;
        border-top: 1px solid #ddd;
    }
    .ai-chat-input input {
        flex: 1;
    }
</style>

<div class="card">
    <h2>AI Assistant</h2>
    <p class="text-muted mb-3">Describe what you want to create or modify, and the AI will help you build it.</p>

    <div class="ai-chat-container" x-data="aiChat()">
        <div class="ai-chat-messages" id="chat-messages">
            <div class="ai-chat-message assistant">
                <strong>Assistant:</strong><br>
                Hello! I'm your AI report design assistant. How can I help you today?
            </div>
        </div>
        <form class="ai-chat-input" @submit.prevent="sendMessage">
            <input type="text" 
                   x-model="message" 
                   placeholder="Describe what you want..." 
                   class="form-control"
                   required>
            <button type="submit" class="btn btn-primary" :disabled="sending">
                {{ 'Sending...' if sending else 'Send' }}
            </button>
        </form>
    </div>
</div>

<script>
    function aiChat() {
        return {
            message: '',
            sending: false,
            history: [],

            async sendMessage() {
                if (!this.message.trim()) return;

                const userMessage = this.message;
                this.history.push({role: 'user', content: userMessage});
                this.message = '';
                this.sending = true;

                this.renderMessages();

                try {
                    const response = await fetch('/ai/chat', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            message: userMessage,
                            history: this.history.slice(-10)
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.history.push({role: 'assistant', content: data.response});
                    } else {
                        const error = await response.json();
                        this.history.push({role: 'assistant', content: `Error: ${error.detail || 'Unknown error'}`});
                    }
                } catch (error) {
                    this.history.push({role: 'assistant', content: `Error: ${error.message}`});
                }

                this.sending = false;
                this.renderMessages();
            },

            renderMessages() {
                const container = document.getElementById('chat-messages');
                container.innerHTML = this.history.map(msg => `
                    <div class="ai-chat-message ${msg.role}">
                        <strong>${msg.role === 'user' ? 'You' : 'Assistant'}:</strong><br>
                        ${msg.content}
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            }
        };
    }
</script>
