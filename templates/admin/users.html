{% extends "base.html" %}

{% block title %}User Management - InstantReports{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>User Management</h1>
    <button class="btn btn-primary" onclick="showCreateUserModal()">+ New User</button>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Auth Source</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="users-table">
            <tr>
                <td colspan="6" class="text-center text-muted">Loading users...</td>
            </tr>
        </tbody>
    </table>
</div>

<div id="create-user-modal" class="modal">
    <div class="modal-content card">
        <h2>Create New User</h2>
        <form id="create-user-form">
            <div class="form-group">
                <label for="user-name">Name</label>
                <input type="text" id="user-name" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="user-email">Email</label>
                <input type="email" id="user-email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="user-password">Password</label>
                <input type="password" id="user-password" name="password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="user-role">Role</label>
                <select id="user-role" name="role" class="form-control">
                    <option value="viewer">Viewer</option>
                    <option value="designer">Designer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Create User</button>
                <button type="button" class="btn btn-secondary" onclick="hideCreateUserModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<div id="edit-user-modal" class="modal">
    <div class="modal-content card">
        <h2>Edit User</h2>
        <form id="edit-user-form">
            <input type="hidden" id="edit-user-id" name="id">
            <div class="form-group">
                <label for="edit-user-name">Name</label>
                <input type="text" id="edit-user-name" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="edit-user-email">Email</label>
                <input type="email" id="edit-user-email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="edit-user-password">New Password (leave blank to keep current)</label>
                <input type="password" id="edit-user-password" name="password" class="form-control">
            </div>
            <div class="form-group">
                <label for="edit-user-role">Role</label>
                <select id="edit-user-role" name="role" class="form-control">
                    <option value="viewer">Viewer</option>
                    <option value="designer">Designer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="edit-user-active" name="is_active"> Active
                </label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <button type="button" class="btn btn-secondary" onclick="hideEditUserModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    async function loadUsers() {
        try {
            const response = await fetch('/admin/api/users');
            if (response.ok) {
                const users = await response.json();
                const tbody = document.getElementById('users-table');
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No users found.</td></tr>';
                    return;
                }

                tbody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td><span class="badge bg-${user.role === 'admin' ? 'danger' : user.role === 'designer' ? 'primary' : 'secondary'}">${user.role}</span></td>
                        <td>${user.auth_source}</td>
                        <td>${user.is_active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}</td>
                        <td>
                            <button class="btn btn-sm btn-secondary" onclick="editUser('${user.id}')">Edit</button>
                            ${user.role !== 'admin' ? `<button class="btn btn-sm btn-danger" onclick="deleteUser('${user.id}')">Delete</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            }
        } catch (error) {
            console.error('Error loading users:', error);
        }
    }

    function showCreateUserModal() {
        document.getElementById('create-user-modal').classList.add('active');
        document.getElementById('create-user-form').reset();
    }

    function hideCreateUserModal() {
        document.getElementById('create-user-modal').classList.remove('active');
    }

    async function editUser(userId) {
        try {
            const response = await fetch(`/admin/api/users/${userId}`);
            if (!response.ok) throw new Error('Failed to fetch user');
            
            const user = await response.json();
            
            document.getElementById('edit-user-id').value = user.id;
            document.getElementById('edit-user-name').value = user.name;
            document.getElementById('edit-user-email').value = user.email;
            document.getElementById('edit-user-role').value = user.role;
            document.getElementById('edit-user-active').checked = user.is_active;
            document.getElementById('edit-user-password').value = ''; // Clear password field
            
            document.getElementById('edit-user-modal').classList.add('active');
        } catch (error) {
            console.error('Error editing user:', error);
            alert('Failed to load user details: ' + error.message);
        }
    }

    function hideEditUserModal() {
        document.getElementById('edit-user-modal').classList.remove('active');
    }

    async function deleteUser(userId) {
        if (!confirm('Are you sure you want to delete this user?')) return;
        
        try {
            const response = await fetch(`/admin/api/users/${userId}`, {
                method: 'DELETE',
            });
            
            if (response.ok) {
                loadUsers();
            } else {
                const error = await response.json();
                alert('Failed to delete user: ' + (error.detail || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error deleting user:', error);
        }
    }

    document.getElementById('create-user-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        
        try {
            const response = await fetch('/admin/api/users', {
                method: 'POST',
                body: formData,
            });
            
            if (response.ok) {
                hideCreateUserModal();
                loadUsers();
            } else {
                const error = await response.json();
                alert('Failed to create user: ' + (error.detail || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error creating user:', error);
        }
    });

    document.getElementById('edit-user-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const userId = document.getElementById('edit-user-id').value;
        const formData = new FormData(this);
        formData.delete('id'); // Don't send ID in form data
        
        try {
            const response = await fetch(`/admin/api/users/${userId}`, {
                method: 'PUT',
                body: formData,
            });
            
            if (response.ok) {
                hideEditUserModal();
                loadUsers();
            } else {
                const error = await response.json();
                alert('Failed to update user: ' + (error.detail || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error updating user:', error);
        }
    });

    loadUsers();
</script>
{% endblock %}
