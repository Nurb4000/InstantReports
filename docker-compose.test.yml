services:
  northwind:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: northwind
      POSTGRES_USER: northwind
      POSTGRES_PASSWORD: northwind
    ports:
      - "5434:5432"
    volumes:
      - ../test-assets/northwind/init.sql:/docker-entrypoint-initdb.d/01-northwind.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwind -d northwind"]
      interval: 5s
      timeout: 5s
      retries: 5
